<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home - E-Capstone Storage Data Bank System</title>
    <link rel="stylesheet" href="/Frontend/CSS/homePage.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="dashboard-container">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <!-- Logo Section -->
        <div class="sidebar-header">
          <div class="logo-icon">
            <img src="/Frontend/IMAGES/logo.png" class="actual-logo">
          </div>
          <h1>E-Capstone</h1>
        </div>

        <!-- Navigation Menu -->
        <nav class="menu">
          <!-- Home -->
          <a href="#home" class="menu-item active large" data-page="home">
            <img src="/Frontend/IMAGES/HomeIcon.png" class="menu-icon" />
            <span>Home</span>
          </a>

          <!-- Submission (Collapsible) -->
          <div class="menu-item dropdown-toggle large">
            <img src="/Frontend/IMAGES/MenuIcon.png" class="menu-icon">
            <span>Submission</span>
            <span class="triangle">&#9654;</span>
          </div>

          <div class="submenu">
            <a href="#applicationDevelopment" class="submenu-item" data-page="applicationDevelopment">
              <img src="/Frontend/IMAGES/AppdevIcon.png" class="submenu-icon">
              Application Development
            </a>

            <a href="#webApplication" class="submenu-item" data-page="webApplication">
              <img src="/Frontend/IMAGES/WebapplicaitonIcon.png" class="submenu-icon">
              Web Application
            </a>

            <a href="#gameDevelopment" class="submenu-item" data-page="gameDevelopment">
              <img src="/Frontend/IMAGES/GamedevIcon.png" class="submenu-icon">
              Game Development
            </a>

            <a href="#internetofThings" class="submenu-item" data-page="internetofThings">
              <img src="/Frontend/IMAGES/iot.png" class="submenu-icon">
              Internet of Things
            </a>
          </div>

          <!-- Management (Collapsible) -->
          <div class="menu-item dropdown-toggle large">
            <img src="/Frontend/IMAGES/MenuIcon.png" class="menu-icon">
            <span>Management</span>
            <span class="triangle">&#9654;</span>
          </div>

          <div class="submenu">
            <a href="#AppdevData" class="submenu-item" data-page="appdevData">
              <img src="/Frontend/IMAGES/folder.png" class="submenu-icon" />
              Application Development
            </a>

            <a href="#webappData" class="submenu-item" data-page="webappData">
              <img src="/Frontend/IMAGES/folder.png" class="submenu-icon" />
              Web Application
            </a>

            <a href="#gamedevData" class="submenu-item" data-page="gamedevData">
              <img src="/Frontend/IMAGES/folder.png"class="submenu-icon" />
              Game Development
            </a>

            <a href="#InternetofThingsData" class="submenu-item" data-page="iotData">
              <img src="/Frontend/IMAGES/folder.png" class="submenu-icon" />
              Internet of Things
            </a>
          </div>
        </nav>

        <!-- Profile Section -->
        <div class="profile-section">
          <a href="#" class="profile-btn">
            <div class="profile-info">
              <img
                src="/Frontend/IMAGES/user.png"
                alt="Profile Logo"
                class="profile-pic"
              />
              <div class="profile-texts">
                <span class="profile-text">Profile Information</span>
                <span class="profile-label">Admin</span>
              </div>
            </div>
          </a>
        </div>

        <!-- Logout Button -->
        <div class="profile-section">
          <button id="logoutBtn" class="logout-btn">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
          </button>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="main-content">
        <!-- Header / Topbar -->
        <header class="topbar">
          <button class="menu-toggle" id="menuToggle">
            <i class="fas fa-bars"></i>
          </button>

          <h2 class="page-title" id="dynamicPageTitle">Home</h2>

          <div class="header-actions">
            <button class="icon-btn notification-btn">
              <i class="fas fa-bell"></i>
              <span class="badge">3</span>
            </button>
          </div>
        </header>

        <!-- Content Area -->
        <div class="content-area" id="dynamicContent">
          <!-- Dynamic content will load here -->
        </div>
      </main>
    </div>

    <!-- Logout confirmation popup -->
    <div
      id="logoutPopup"
      class="popup"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
    >
      <div class="popup-content" role="document">
        <div class="success-icon" aria-hidden="true">
          <img
            src="/Frontend/IMAGES/logout.png"
            alt="E-Capstone Logo"
            class="logout-popup-image"
          />
        </div>

        <div class="success-title">Do you want to logout now?</div>
        <div class="success-sub">You will be returned to the login page.</div>

        <div class="logout-actions">
          <button type="button" class="success-btn confirm-logout">Yes</button>
          <button type="button" class="cancel-logout">No</button>
        </div>
      </div>
    </div>

    <script src="/Frontend/JAVASCRIPT/homePage.js"></script>
  </body>
</html>
