<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Application</title>
  <link rel="stylesheet" href="/Frontend/CSS/Submission/webApplication.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
</head>
<body>
  <div class="form-container">
    <div class="form-header">
      <div class="header-content">
        <span class="form-title">Capstone Project Information</span>
        <span class="form-category">Web Application</span>
      </div>
      <div class="header-decoration">
        <div class="decoration-circle"></div>
        <div class="decoration-circle"></div>
      </div>
    </div>

    <form class="capstone-form" id="capstoneForm">
      <!-- Left Column -->
      <div class="form-column">
        <div class="form-group">
          <label for="professor">Professor</label>
          <input type="text" id="professor" name="professor" placeholder="Enter professor's name" />
        </div>
        <div class="form-group">
          <label for="title">Project Title</label>
          <input type="text" id="title" name="title" placeholder="Enter project title" />
        </div>
        <div class="form-group">
          <label for="year">Academic Year</label>
          <input type="text" id="year" name="year" placeholder="e.g., 2023-2024" />
        </div>
      </div>

      <!-- Right Column -->
      <div class="form-column">
        <div class="form-group">
          <label for="abstract">Abstract</label>
          <textarea id="abstract" name="abstract" rows="5" placeholder="Provide a brief description of your project"></textarea>  
        </div>

        <div class="form-group">
          <label for="upload">Upload PDF file</label>
          <div class="file-upload-wrapper">
            <input type="file" id="upload" name="upload" accept=".pdf" />
            <button type="button" class="upload-btn" id="uploadTrigger">
              <i class="fas fa-upload"></i>
              <span class="btn-text">Choose PDF File</span>
              <span class="file-status">No file chosen</span>
            </button>
          </div>
        </div>
      </div>

      <input type="hidden" id="teamMembersData" name="teamMembersData">
    </form>

    <div class="form-group">
      <label for="pictureUpload">Upload Project Pictures (Minimum 5)</label>
      <div class="picture-upload-wrapper">
        <input type="file" id="pictureUpload" name="pictures[]" accept="image/*" multiple />
        <button type="button" class="upload-pictures-btn" id="uploadPicturesTrigger">
          <i class="fas fa-images"></i>
          <span class="btn-text">Choose Pictures</span>
          <span class="picture-status">No pictures chosen</span>
        </button>
        <div class="pictures-preview" id="picturesPreview"></div>
      </div>
    </div>

    <!-- Team Members -->
    <div class="team-members-columns">
      <h3>Team Members</h3>
      <div class="member-columns-form">
        <div class="column">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" placeholder="Enter full name">
        </div>
        <div class="column">
          <label for="section">Section</label>
          <input type="text" id="section" name="section" placeholder="Enter section">
        </div>
        <div class="column">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter email">
        </div>
        <div class="column">
          <button type="button" id="addColumnMember">Add Member</button>
        </div>
      </div>

      <div class="additional-buttons">
        <button type="submit" class="btn btn-primary" form="capstoneForm">Submit Project</button>
      </div>
    </div>
  </div>

  <!-- ========== POPUP CONTAINERS ========== -->
  
  <!-- Submit Confirmation Popup -->
  <div id="submitPopup" class="popup-overlay" aria-hidden="true">
    <div class="popup-content">
      <h3>Confirm Submission</h3>
      <p>Are you sure you want to submit this project?</p>
      <div class="popup-buttons">
        <button class="confirm-submit">Yes, Submit</button>
        <button class="cancel-submit">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Success Popup -->
  <div id="submitSuccess" class="popup-overlay" aria-hidden="true">
    <div class="popup-content">
      <h3>Submission Successful!</h3>
      <p>Your project has been submitted successfully.</p>
      <div class="popup-buttons">
        <button class="confirm-success">OK</button>
        <button id="generateQrBtn">Generate QR Code</button>
      </div>
    </div>
  </div>

  <!-- QR Code Popup -->
  <div id="qrPopup" class="popup-overlay" aria-hidden="true">
    <div class="popup-content">
      <h3>QR Code Generated</h3>
      <div id="qrCodeDisplay"></div>
      <div class="popup-buttons">
        <button id="downloadQrBtn">Download QR</button>
        <button id="skipQrBtn">Skip </button>
      </div>
    </div>
  </div>

  <!-- Validation Error Popup -->
  <div id="validationPopup" class="popup-overlay" aria-hidden="true">
    <div class="popup-content">
      <h3>Validation Error</h3>
      <p id="validationMessage">Please check the form for errors.</p>
      <div class="popup-buttons">
        <button class="close-error-btn">OK</button>
      </div>
    </div>
  </div>

  <!-- Picture Validation Message -->
  <div id="pictureValidation" class="validation-message" style="display: none;"></div>

  <!-- Clear Success Notification -->
  <div id="clearSuccess" class="notification" style="display: none;">
    <p>Form cleared successfully!</p>
  </div>

  <script src="/Frontend/JAVASCRIPT/Submission/webApplication.js"></script>
</body>
</html>
